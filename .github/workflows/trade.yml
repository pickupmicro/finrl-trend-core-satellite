name: live-paper-trading
on:
  schedule:
    - cron: "45 14 * * 1-5"   # 09:45 New York in winter (EST); 10:45 in summer (EDT)
    - cron: "15 21 * * 1-5"   # after the close: equity snapshot
  workflow_dispatch:
concurrency: trading
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      APCA_API_KEY: ${{ secrets.APCA_API_KEY }}
      APCA_API_SECRET: ${{ secrets.APCA_API_SECRET }}
      APCA_BASE_URL: https://paper-api.alpaca.markets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-live.txt
      - name: Trade
        if: github.event.schedule != '15 21 * * 1-5'
        run: python -m scripts.run_daily
      - name: Equity snapshot
        if: github.event.schedule == '15 21 * * 1-5'
        run: python -m scripts.run_daily --snapshot
      - name: Commit logs
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add logs results
          git commit -m "logs: $(date -u +%F' '%H:%M) UTC" || echo "nothing to commit"
          git pull --rebase && git push
